server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: nutrifybe-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://${DB_HOST:nutrifybe_db.mssql.somee.com}:1433;databaseName=${DB_NAME:nutrifybe_db};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true};loginTimeout=30}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    key: ${ADMIN_API_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
